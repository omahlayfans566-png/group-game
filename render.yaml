services:
  - type: web
    name: survival-game-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GROUP_LINK
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_DNS_OVERRIDE
        value: "false"

  - type: web
    name: survival-game-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_APP_NAME
        value: SURVIVAL
      - key: VITE_GROUP_LINK
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
